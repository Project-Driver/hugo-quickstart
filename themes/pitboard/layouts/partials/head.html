<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ $title := .Site.Title }}{{ if not .IsHome }}{{ $title = printf "%s · %s" .Title .Site.Title }}{{ end }}
  <title>{{ $title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/pitboard.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Pit Board",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "SMS, Email, Web",
    "description": {{ .Site.Params.description | jsonify }},
    "offers": [
      {"@type": "Offer", "name": "Board", "price": "97", "priceCurrency": "USD", "billingIncrement": "P1M"},
      {"@type": "Offer", "name": "Crew", "price": "247", "priceCurrency": "USD", "billingIncrement": "P1M"},
      {"@type": "Offer", "name": "Pro", "price": "497", "priceCurrency": "USD", "billingIncrement": "P1M"}
    ],
    "provider": {"@type": "Organization", "name": "Project Driver", "url": "https://project-driver.com/"}
  }
  </script>
</head>
