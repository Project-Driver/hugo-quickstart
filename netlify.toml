[build]
  command = "hugo --minify"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.101.0"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/sample_board.json"]

# Public API for the site: /api/signup, /api/board, /api/daily (protected)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/pitboard-:splat"
  status = 200

[[plugins]]
  package = "netlify-plugin-cypress"

  [plugins.inputs.postBuild]
    enable = true

  [plugins.inputs]
    enable = false
