[build]
  command = "hugo --minify"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.101.0"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/sample_board.json"]

# Public API. Short names for the Pit Board endpoints, then everything else by function name.
[[redirects]]
  from = "/api/signup"
  to = "/.netlify/functions/pitboard-signup"
  status = 200

[[redirects]]
  from = "/api/board"
  to = "/.netlify/functions/pitboard-board"
  status = 200

[[redirects]]
  from = "/api/run"
  to = "/.netlify/functions/pitboard-run"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[plugins]]
  package = "netlify-plugin-cypress"

  [plugins.inputs.postBuild]
    enable = true

  [plugins.inputs]
    enable = false
